name: Database keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep production API and database warm
        run: >-
          curl
          --fail
          --show-error
          --silent
          --retry 5
          --retry-all-errors
          --retry-delay 10
          --max-time 60
          https://brisio-api-gofb.onrender.com/api/health/database
