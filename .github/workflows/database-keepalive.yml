name: Database keepalive

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Query production database
        run: curl --fail --show-error --silent --retry 3 --retry-delay 10 https://brisio-api-gofb.onrender.com/api/health/database