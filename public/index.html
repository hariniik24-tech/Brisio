<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brisio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6fbff;
      --surface: #ffffff;
      --surface-card: rgba(255, 255, 255, 0.94);
      --surface-soft: #f7fafc;
      --text: #1a2331;
      --muted: #667487;
      --border: #dce4ec;
      --brand: #117a8b;
      --brand-strong: #0f5f78;
      --accent: #e06f3a;
      --org: #2e5fb1;
      --business: #247251;
      --shadow: 0 14px 30px rgba(19, 45, 70, 0.08);
      --radius-lg: 18px;
      --radius-md: 14px;
      --bg-gradient: linear-gradient(145deg, #f6fbff 0%, #fef9f3 45%, #f4fbf8 100%);
      --hero-grad: linear-gradient(140deg, #ffffff, #f5fbff 58%, #fff8f2 100%);
      --step-grad: linear-gradient(160deg, #ffffff, #f8fcff);
      --detail-grad: linear-gradient(145deg, #fcfeff, #f0f8ff);
      --status-bg: #e7f4ef;
      --status-text: #245f47;
      --chat-user-bg: #e5f3f7;
      --chat-assistant-bg: #f6f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      position: relative;
      letter-spacing: 0;
      background-image: var(--bg-gradient);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 999px;
      z-index: -1;
      pointer-events: none;
      filter: blur(2px);
    }

    body::before {
      width: 320px;
      height: 320px;
      top: -110px;
      right: -90px;
      background: radial-gradient(circle, rgba(61, 170, 193, 0.2) 0%, rgba(61, 170, 193, 0) 72%);
    }

    body::after {
      width: 340px;
      height: 340px;
      bottom: -140px;
      left: -120px;
      background: radial-gradient(circle, rgba(234, 146, 88, 0.18) 0%, rgba(234, 146, 88, 0) 72%);
    }

    h1,
    h2,
    h3 {
      font-family: "Space Grotesk", "Inter", sans-serif;
      letter-spacing: -0.02em;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 16px 12px 36px;
    }

    @media (max-width: 780px) {
      .app {
        width: min(100%, 460px);
      }
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(3px);
      animation: rise 420ms ease-out both;
    }

    .card:nth-child(2) { animation-delay: 40ms; }
    .card:nth-child(3) { animation-delay: 80ms; }
    .card:nth-child(4) { animation-delay: 120ms; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .bridge-emblem {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      padding: 7px;
      background: linear-gradient(150deg, #f9fdff, #edf7ff 55%, #fff6ee);
      border: 1px solid #d3e3f0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.95), 0 10px 22px rgba(24, 66, 101, 0.11);
    }

    .bridge-emblem svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brand-wordmark {
      display: inline-block;
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-size: 1.22rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1a3147;
      white-space: nowrap;
    }

    .cg-monogram {
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
      color: #214969;
    }

    .brand-stack {
      display: grid;
      gap: 2px;
    }

    .brand {
      margin: 0;
      font-size: 1.22rem;
      line-height: 1.1;
      font-weight: 800;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.015em;
      font-weight: 600;
    }

    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .row { display: grid; gap: 10px; }
    .two,
    .three { grid-template-columns: 1fr; }

    @media (min-width: 900px) {
      .two { grid-template-columns: 1fr 1fr; }
      .three { grid-template-columns: repeat(3, 1fr); }
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      color: #44596d;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      padding: 11px 12px;
      color: var(--text);
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 140ms ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #89b8c4;
      box-shadow: 0 0 0 4px rgba(17, 122, 139, 0.14);
    }

    textarea { min-height: 90px; resize: vertical; }

    button {
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 140ms ease, box-shadow 200ms ease, background 200ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .btn {
      background: linear-gradient(130deg, var(--brand), var(--brand-strong));
      color: #fff;
      box-shadow: 0 10px 18px rgba(17, 122, 139, 0.24);
    }

    .btn-alt {
      background: #eef3f8;
      color: var(--text);
    }

    .btn-mini { padding: 6px 10px; font-size: 12px; margin-right: 6px; margin-bottom: 6px; }

    .btn-chip {
      padding: 9px 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 13px;
    }

    .btn-chip.active {
      background: linear-gradient(130deg, #1e8797, #1b6f99);
      color: #fff;
      border-color: #1d7898;
    }

    .pill {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .role-business { background: #e5f2eb; color: var(--business); }
    .role-organization { background: #e7edf9; color: var(--org); }

    .listing {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px;
      display: grid;
      gap: 6px;
      margin-bottom: 10px;
      background: #fff;
      cursor: pointer;
      transition: transform 140ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .listing:hover {
      transform: translateY(-1px);
      border-color: #b7c8d8;
      box-shadow: 0 10px 18px rgba(21, 49, 76, 0.08);
    }

    .listing.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 1px rgba(17, 122, 139, 0.12), 0 12px 24px rgba(17, 122, 139, 0.1);
    }

    .badge {
      background: #eaf1f8;
      color: #284058;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .private { background: #f6e7dd; color: #9b4c1c; }
    .hidden { display: none; }

    .result {
      border: 1px solid var(--border);
      padding: 12px 14px;
      margin-top: 10px;
      background: #f8fcff;
      border-radius: 12px;
    }

    .message { margin-top: 6px; color: var(--accent); }

    .screen-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 6px;
    }

    .screen-chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .screen-chip.active {
      background: linear-gradient(130deg, #1e8797, #1b6f99);
      color: #fff;
      border-color: #1d7898;
    }

    .section-stack {
      display: grid;
      gap: 14px;
      margin-top: 14px;
    }

    .overview-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 900px) {
      .overview-grid { grid-template-columns: 1.1fr 0.9fr; }
    }

    .quick-panel {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .step-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: var(--step-grad);
      display: grid;
      gap: 8px;
    }

    .hero {
      background: var(--hero-grad);
    }

    .hero-accent {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: linear-gradient(130deg, rgba(17, 122, 139, 0.1), rgba(46, 95, 177, 0.07));
      margin-top: 12px;
    }

    .hero-kpis {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 12px;
    }

    .kpi-chip {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: #fbfdff;
    }

    .kpi-chip strong {
      display: block;
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-size: 1.12rem;
      color: #1d3c57;
    }

    .ai-highlight {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: linear-gradient(140deg, #edf9fb, #eef5ff);
      display: grid;
      gap: 10px;
    }

    .role-shell {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: grid;
      gap: 8px;
      background: #fcfeff;
    }

    .role-shell.business {
      background: linear-gradient(140deg, #eefbf3, #fafdff 65%);
    }

    .role-shell.nonprofit {
      background: linear-gradient(140deg, #eef3ff, #fafdff 65%);
    }

    .hero h1, .hero h2 { margin: 0 0 10px; }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .soft-list {
      margin: 12px 0 0;
      padding-left: 18px;
      color: var(--muted);
    }

    .board-shell {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 980px) {
      .board-shell { grid-template-columns: 1fr 1.08fr; }
    }

    .board-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 14px;
    }

    .listing-detail {
      border: 1px solid var(--border);
      background: var(--detail-grad);
      color: var(--text);
      border-radius: 16px;
      padding: 16px;
      display: grid;
      gap: 10px;
    }

    .listing-detail .detail-box {
      background: #ffffff;
      border-color: #dce4ec;
      color: var(--text);
    }

    .listing-detail .detail-box .small,
    .listing-detail .detail-box .muted,
    .listing-detail .small.muted {
      color: var(--muted);
    }

    .listing-detail .badge,
    .listing-detail .status-badge {
      background: #eaf1f8;
      color: #27435d;
    }
    .dashboard-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 900px) {
      .dashboard-grid { grid-template-columns: 1.2fr 0.8fr; }
    }

    .stat-strip {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 760px) {
      .stat-strip { grid-template-columns: repeat(3, 1fr); }
    }

    .stat-tile {
      background: linear-gradient(160deg, #f4fbff, #fff);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .stat-tile strong {
      font-size: 1.35rem;
      font-family: "Space Grotesk", "Inter", sans-serif;
      color: #1b3852;
    }

    .detail-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 760px) {
      .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .detail-box {
      background: #f8fbff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--status-bg);
      color: var(--status-text);
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }
    .message-thread {
      display: grid;
      gap: 8px;
      margin: 10px 0;
      max-height: 260px;
      overflow-y: auto;
    }
    .message-bubble {
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fbff;
      padding: 10px 12px;
    }

    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .textarea-sm { min-height: 70px; }
    .chat-log {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: #fafdff;
      max-height: 280px;
      overflow-y: auto;
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }
    .chat-item {
      border-radius: 10px;
      padding: 8px 10px;
      max-width: 90%;
      line-height: 1.4;
    }

    .chat-user {
      background: var(--chat-user-bg);
      margin-left: auto;
    }

    .chat-assistant { background: var(--chat-assistant-bg); }

    .brand-line {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      text-align: right;
    }

    @media (max-width: 700px) {
      .brand-line {
        text-align: left;
        width: 100%;
      }

      .topbar {
        align-items: flex-start;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1724;
        --surface: #111b2b;
        --surface-card: rgba(17, 27, 43, 0.94);
        --surface-soft: #172335;
        --text: #e7eef8;
        --muted: #a4b3c7;
        --border: #2a3a50;
        --brand: #52a7ba;
        --brand-strong: #387b92;
        --accent: #ffb282;
        --org: #8cb3ff;
        --business: #80d3ab;
        --shadow: 0 14px 28px rgba(0, 0, 0, 0.36);
        --bg-gradient: linear-gradient(150deg, #0f1724 0%, #121c2d 52%, #122026 100%);
        --hero-grad: linear-gradient(145deg, #18273c, #17263b 58%, #1f2d3f 100%);
        --step-grad: linear-gradient(160deg, #162437, #142133);
        --detail-grad: linear-gradient(145deg, #16263a, #132033);
        --status-bg: #1f3a31;
        --status-text: #97e0bd;
        --chat-user-bg: #1c3542;
        --chat-assistant-bg: #1a2335;
      }

      .bridge-emblem {
        background: linear-gradient(150deg, #203147, #1a2f44 55%, #293546);
        border-color: #35506c;
        box-shadow: inset 0 0 0 1px rgba(231, 238, 248, 0.08), 0 10px 18px rgba(0, 0, 0, 0.3);
      }

      .brand-wordmark {
        color: #e7eef8;
      }

      label {
        color: #c5d4e8;
      }

      input,
      select,
      textarea {
        background: #132035;
        color: #e7eef8;
        border-color: #2e425d;
      }

      .btn-alt,
      .btn-chip,
      .screen-chip,
      .listing,
      .detail-box,
      .message-bubble,
      .chat-log,
      .stat-tile,
      .listing-detail .detail-box,
      .result {
        background: #152338;
        color: #e7eef8;
        border-color: #2a3d56;
      }

      .hero-accent,
      .kpi-chip,
      .ai-highlight,
      .role-shell,
      .role-shell.business,
      .role-shell.nonprofit {
        background: #18283c;
        border-color: #2f4563;
        color: #e7eef8;
      }

      .kpi-chip strong {
        color: #e1ecfb;
      }

      .listing:hover {
        border-color: #4e6a8d;
      }

      .badge,
      .listing-detail .badge,
      .listing-detail .status-badge {
        background: #26364d;
        color: #d5e4f8;
      }

      .private {
        background: #483326;
        color: #ffcea8;
      }

      .role-business { background: #233b32; color: #9de9c2; }
      .role-organization { background: #243656; color: #b8d0ff; }

      .stat-tile strong {
        color: #dce8f7;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card topbar">
      <div class="brand-wrap">
        <div class="bridge-emblem" aria-hidden="true">
          <svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="44" cy="24" r="10" fill="#FFD88A" />
            <path d="M17 49C23 38 32 33 44 33C56 33 65 38 71 49" stroke="#2F8EAD" stroke-width="5.6" stroke-linecap="round" />
            <rect x="14" y="49" width="60" height="8" rx="4" fill="#1D4F73" />
            <line x1="28" y1="49" x2="28" y2="41" stroke="#1D4F73" stroke-width="3.1" stroke-linecap="round" />
            <line x1="44" y1="49" x2="44" y2="39" stroke="#1D4F73" stroke-width="3.1" stroke-linecap="round" />
            <line x1="60" y1="49" x2="60" y2="41" stroke="#1D4F73" stroke-width="3.1" stroke-linecap="round" />
            <path d="M20 63H68" stroke="#5CB9C7" stroke-width="3" stroke-linecap="round" />
            <path d="M24 69H64" stroke="#E78C55" stroke-width="2.4" stroke-linecap="round" opacity="0.95" />
          </svg>
        </div>
        <div class="brand-stack">
          <h1 class="brand">
            <span class="brand-wordmark">Brisio</span>
          </h1>
          <div class="brand-sub">Bridging resources. Strengthening communities.</div>
        </div>
      </div>
      <div id="userLine" class="brand-line">Bridging resources. Strengthening communities.</div>
    </div>
    <div id="root"></div>
  </div>

  <script>
    const state = {
      token: localStorage.getItem('cg-token') || '',
      user: null,
      authMode: 'login',
      listings: [],
      stats: null,
      organizations: [],
      aiInsights: null,
      engagements: [],
      bestMatch: null,
      view: 'loading',
      dashboardSection: 'overview',
      message: '',
      listingFilter: 'all',
      selectedListingId: '',
      legacyMatches: [],
      chatHistory: [],
      lastChatReply: null
    };

    const root = document.getElementById('root');
    const userLine = document.getElementById('userLine');

    function setMessage(text) {
      state.message = text || '';
      render();
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text || '').replace(/[&<>"']/g, (m) => map[m]);
    }

    async function api(url, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      const res = await fetch(url, { ...options, headers });
      const data = await res.json();
      if (res.status === 401) {
        localStorage.removeItem('cg-token');
        state.token = '';
        state.user = null;
        state.view = 'auth';
        render();
      }
      return data;
    }

    async function boot() {
      if (state.token) {
        const me = await api('/api/auth/me');
        if (me.success) {
          state.user = me.user;
          state.dashboardSection = defaultDashboardSectionForRole(me.user && me.user.role);
          state.listingFilter = me.user && me.user.role === 'organization' ? 'supply' : 'all';
        }
      }
      state.view = state.user ? 'dashboard' : 'auth';
      if (state.user) await refreshData();
      render();
    }

    async function refreshData() {
      const [listingsRes, statsRes, insightsRes, engagementsRes] = await Promise.all([
        api('/api/listings'),
        api('/api/stats'),
        api('/api/ai-insights'),
        api('/api/engagements')
      ]);
      state.listings = listingsRes.listings || [];
      state.stats = statsRes.stats || null;
      state.aiInsights = insightsRes.insights || null;
      state.engagements = engagementsRes.engagements || [];
      if (!state.selectedListingId || !state.listings.some((listing) => listing.id === state.selectedListingId)) {
        state.selectedListingId = state.listings[0] ? state.listings[0].id : '';
      }

      if (state.user && state.user.role === 'business') {
        const orgsRes = await api('/api/organizations');
        state.organizations = orgsRes.organizations || [];
      }

      if (state.chatHistory.length === 0) {
        pushChat('assistant', 'Welcome back. Share what you can or find what you need, and I will suggest the best current matches.', [

    function formatAddress(street, city, stateCode, zip) {
      return [street, city, stateCode, zip].filter(Boolean).join(', ');
    }

    function getPasswordPolicyError(password) {
      const value = String(password || '');
      if (value.length < 10) return 'Password must be at least 10 characters.';
      if (!/[A-Z]/.test(value)) return 'Password must include at least one uppercase letter.';
      if (!/[a-z]/.test(value)) return 'Password must include at least one lowercase letter.';
      if (!/\d/.test(value)) return 'Password must include at least one number.';
      if (!/[^A-Za-z0-9]/.test(value)) return 'Password must include at least one special character.';
      return '';
    }

    async function submitAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      if (!email || !password) {
        return setMessage('Please complete all required fields.');
      }

      let res;
      if (state.authMode === 'register') {
        const passwordError = getPasswordPolicyError(password);
        if (passwordError) {
          return setMessage(passwordError);
        }

        const role = document.getElementById('authRole').value;
        const name = document.getElementById('authName').value.trim();
        const organizationName = document.getElementById('authOrganizationName').value.trim();
        const authStreet = getFieldValue('authStreet');
        const authCity = getFieldValue('authCity');
        const authState = getFieldValue('authState');
        const authZip = getFieldValue('authZip');
        const location = formatAddress(authStreet, authCity, authState, authZip);

        if (!role || !name || !authStreet || !authCity || !authState || !authZip) {
          return setMessage('Please complete all required fields.');
        }

        res = await api('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            email,
            password,
            role,
            name,
            organizationName: organizationName || name,
            location
          })
        });
      } else {
        res = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
      }

      if (!res.success) return setMessage(res.error || (state.authMode === 'register' ? 'Registration failed.' : 'Sign in failed.'));

      state.token = res.token;
      localStorage.setItem('cg-token', res.token);
      state.user = res.user;
      state.view = 'dashboard';
      state.dashboardSection = defaultDashboardSectionForRole(res.user && res.user.role);
      state.listingFilter = res.user && res.user.role === 'organization' ? 'supply' : 'all';
      state.message = '';
      await refreshData();
      await runQuickRecommend();
      render();
    }

    async function runQuickRecommend() {
      const promptEl = document.getElementById('generalAiPrompt');

      const fallbackPrompt = state.user && state.user.role === 'organization'
        ? `Recommend the best current support option near ${state.user.location || 'my area'}`
        : `Recommend where I can help most right now near ${state.user && state.user.location ? state.user.location : 'my area'}`;

        summary: `${res.assistant.summary} (Built from ${res.basis && res.basis.listingsAnalyzed ? res.basis.listingsAnalyzed : 0} live listings, client need details, urgency, location, and current platform signals.)`,

    function pushChat(role, text, actions) {
      state.chatHistory.push({ role, text, actions: actions || [] });
    }

    async function sendChat() {
      const inputEl = document.getElementById('chatInput');
      const message = inputEl.value.trim();
      if (!message) return;

      pushChat('user', message, []);
      inputEl.value = '';
      render();

      const res = await api('/api/chat', {
        method: 'POST',
        body: JSON.stringify({ message })
      });

      if (!res.success) {
        pushChat('assistant', res.error || 'Chat request failed.', []);
        render();
        return;
      }

      const reply = res.reply || {};
      state.lastChatReply = reply;
      const actions = [];
      (reply.actions || []).forEach((a) => actions.push(a));
      (reply.suggestions || []).forEach((s) => actions.push(s));
      pushChat('assistant', reply.message || 'Done.', actions);
      render();
    }

    function sendPresetChat(promptText) {
      const inputEl = document.getElementById('chatInput');
      if (!inputEl) return;
      inputEl.value = promptText;
      sendChat();
    }

    async function handleChatAction(actionId, chatIndex, actionIndex) {
      const item = state.chatHistory[chatIndex];
      const action = item && item.actions ? item.actions[actionIndex] : null;
      const data = action ? action.data : null;

      if (!actionId) return;

      if (actionId.indexOf('select_match_') === 0 && data) {
        const text = `Selected ${data.businessName}. Contact: ${data.contact || 'not provided'}.`;
        pushChat('assistant', text, [
          { id: 'accept', text: 'Accept top match', data },
          { id: 'show_more', text: 'Show more matches' }
        ]);
        render();
        return;
      }

      if (actionId === 'show_more') {
        const more = state.lastChatReply && state.lastChatReply.listings ? state.lastChatReply.listings.slice(1, 4) : [];
        if (!more.length) {
          pushChat('assistant', 'No more matches were available in the latest response.', []);
        } else {
          const msg = more.map((m, i) => `${i + 1}. ${m.businessName} (${m.category})`).join(' | ');
          pushChat('assistant', `Other matches: ${msg}`, []);
        }
        render();
        return;
      }

      if (actionId === 'copy_contact' && data && data.contact) {
        try {
          await navigator.clipboard.writeText(String(data.contact));
          pushChat('assistant', `Copied contact: ${data.contact}`, []);
        } catch (e) {
          pushChat('assistant', `Contact: ${data.contact}`, []);
        }
        render();
        return;
      }

      const res = await api('/api/chat/action', {
        method: 'POST',
        body: JSON.stringify({ action: actionId, data })
      });

      if (!res.success) {
        pushChat('assistant', res.error || 'Action failed.', []);
        render();
        return;
      }

      const reply = res.reply || {};
      const actions = (reply.nextStep && reply.nextStep.options) ? reply.nextStep.options : [];
      pushChat('assistant', reply.message || 'Done.', actions);
      render();
    }

            </div>
            <div class="inline-actions">
              <button class="btn" onclick="sendEngagementMessage('${engagement.id}')">Send update</button>
            </div>
            ${renderEngagementActions(engagement)}
          </div>
        `;
      }).join('');
    }

    function renderBestMatchResult() {
      if (!state.bestMatch || !state.bestMatch.best) return '';
      const best = state.bestMatch.best;
      return `
        <div class="result">
          <strong>Best match: ${escapeHtml(best.businessName)}</strong>
          <div>${escapeHtml(best.description)}</div>
          <div class="small muted">
            Confidence ${best.confidence || 0}% - ${escapeHtml(best.location || 'Location unavailable')} -
            ${best.deliverWithinHours ? `deliver in ${best.deliverWithinHours}h` : 'delivery speed not provided'}
          </div>
          <div class="small muted">Evidence: ${escapeHtml(best.evidence || '')}</div>
          <div class="small muted">Analyzed: ${state.bestMatch.basis && state.bestMatch.basis.listingsAnalyzed ? state.bestMatch.basis.listingsAnalyzed : 0} live listings</div>
        </div>
      `;
    }

    function renderChatHistory() {
      if (!state.chatHistory.length) {
        return '<div class="small muted">Try: "I need food today" or "recommend resources for a workshop".</div>';
      }

      return state.chatHistory.map((item, chatIndex) => {
        const actionButtons = (item.actions || []).map((a, actionIndex) => (
          `<button class="btn-alt btn-mini" onclick="handleChatAction('${escapeHtml(a.id)}', ${chatIndex}, ${actionIndex})">${escapeHtml(a.text || a.id)}</button>`
        )).join('');

        return `
          <div class="chat-item ${item.role === 'user' ? 'chat-user' : 'chat-assistant'}">
            <div>${escapeHtml(item.text)}</div>
            ${actionButtons ? `<div style="margin-top:8px;">${actionButtons}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function renderScreenNav() {
      const items = state.user.role === 'business'
        ? [
            ['overview', 'Overview'],
            ['post', 'Post offer'],
            ['board', 'Live board'],
            ['ai', 'AI assistant'],
            ['activity', 'Coordination chat']
          ]
        : [
            ['overview', 'Overview'],
            ['ai', 'AI assistant'],
            ['board', 'Explore board'],
            ['activity', 'Coordination chat']
          ];

      return `
        <div class="screen-nav">
          ${items.map(([key, label]) => `<button class="screen-chip ${state.dashboardSection === key ? 'active' : ''}" onclick="setDashboardSection('${key}')">${escapeHtml(label)}</button>`).join('')}
        </div>
      `;
    }

    function renderOverviewPanel(roleIntro, selectedListing) {
      const nonprofitStepOne = state.user.role === 'organization'
        ? '<strong>1. Explore live offers</strong><div class="small muted">Review active business offers and open one to inspect full details.</div><div class="inline-actions"><button class="btn" onclick="setDashboardSection(\'board\')">Open explore board</button></div>'
        : '<strong>1. Post what you can offer</strong><div class="small muted">Create public listings or private offers for nonprofits who need fast help.</div><div class="inline-actions"><button class="btn" onclick="setDashboardSection(\'post\')">Go to posting screen</button></div>';

      const nonprofitStepTwo = state.user.role === 'organization'
        ? '<strong>2. Ask AI for best fit</strong><div class="small muted">Use your need details and location to get best and closest current options.</div><div class="inline-actions"><button class="btn-alt" onclick="setDashboardSection(\'ai\')">Open AI assistant</button></div>'
        : '<strong>2. Keep supply visible</strong><div class="small muted">Use the live board and AI assistant to route your offers to the right partners.</div><div class="inline-actions"><button class="btn-alt" onclick="setDashboardSection(\'ai\')">Open AI assistant</button></div>';

      return `
        <div class="section-stack">
          <div class="card ai-highlight">
            <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;">
              <div>
                <strong>AI assistant is live</strong>
                <div class="small muted">Ask for best-fit support options from active listings, urgency, location, and role context.</div>
              </div>
              <button class="btn" onclick="setDashboardSection('ai')">Open AI assistant</button>
            </div>
          </div>

          <div class="card">
            <h3 style="margin-top:0;">Your current path</h3>
            <div class="overview-grid">
              <div class="quick-panel">
                <div class="step-card">
                  ${nonprofitStepOne}
                </div>
                <div class="step-card">
                  ${nonprofitStepTwo}
                </div>
                <div class="step-card">
                  <strong>3. Keep coordination in one place</strong>
                  <div class="small muted">Requests, acceptances, delivery timing, and messages stay together.</div>
                  <div class="inline-actions"><button class="btn-alt" onclick="setDashboardSection('activity')">Open coordination screen</button></div>
                </div>
              </div>
              <div class="quick-panel">
                <div class="stat-strip">
                  <div class="stat-tile"><strong>${state.stats && state.stats.total ? state.stats.total : 0}</strong><div class="small muted">active listings</div></div>
                  <div class="stat-tile"><strong>${state.stats && state.stats.supply ? state.stats.supply : 0}</strong><div class="small muted">offers</div></div>
                  <div class="stat-tile"><strong>${state.stats && state.stats.demand ? state.stats.demand : 0}</strong><div class="small muted">requests</div></div>
                </div>
                <div class="step-card">
                  <strong>Live focus</strong>
                  <div class="small muted">${escapeHtml(roleIntro)}</div>
                  <div class="small muted">Selected board item: ${selectedListing ? escapeHtml(selectedListing.businessName) : 'No listing selected yet'}</div>
                  <div class="inline-actions">
                    <button class="btn-alt" onclick="setDashboardSection('board')">Jump to board</button>
                    <button class="btn-alt" onclick="setDashboardSection('ai')">AI assistant</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <h3 style="margin-top:0;">Recommended next actions</h3>
            <div class="row two">
              <div class="detail-box">
                <div class="small muted">${state.user.role === 'business' ? 'Posting screen' : 'Explore board'}</div>
                <strong>${state.user.role === 'business' ? 'Create listings and send private offers' : 'Review offers and request what your organization needs'}</strong>
              </div>
              <div class="detail-box">
                <div class="small muted">AI assistant</div>
                <strong>Use live data to get best-fit recommendations</strong>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAuth() {
      root.innerHTML = `
        <div class="card hero">
          <h1>Welcome to Brisio</h1>
          <p class="muted">A professional resource exchange that helps businesses and nonprofits coordinate faster with less friction.</p>
          <div class="hero-accent">
            <strong>One platform, two purpose-built paths</strong>
            <div class="small muted">Businesses focus on posting and delivery coordination. Nonprofits focus on exploring and requesting the right support quickly.</div>
          </div>
          <div class="hero-kpis">
            <div class="kpi-chip"><strong>AI-guided</strong><div class="small muted">Best-fit suggestions from live listings</div></div>
            <div class="kpi-chip"><strong>Role-based</strong><div class="small muted">Business and nonprofit flows stay distinct</div></div>
            <div class="kpi-chip"><strong>Traceable</strong><div class="small muted">Status, messaging, and handoff in one place</div></div>
          </div>
          <div class="hero-actions">
            <span class="badge">Professional dashboard</span>
            <span class="badge">Direct board</span>
            <span class="badge">Business + nonprofit access</span>
          </div>
          <ul class="soft-list">
            <li>Businesses can post offers, set delivery timing, and send private help quickly.</li>
            <li>Nonprofits can explore offers, request support, and use AI to find best-fit matches.</li>
            <li>Recommendations stay tied to live listings, client need details, urgency, location, and current platform signals.</li>
          </ul>
        </div>
        <div class="card">
          <h2>${state.authMode === 'register' ? 'Create account' : 'Sign in'}</h2>
          <p class="muted">${state.authMode === 'register' ? 'Set up a new account to start posting or requesting resources.' : 'Use your account to access listings and AI matching.'}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;">
            <button class="${state.authMode === 'login' ? 'btn' : 'btn-alt'}" onclick="setAuthMode('login')">Sign in</button>
            <button class="${state.authMode === 'register' ? 'btn' : 'btn-alt'}" onclick="setAuthMode('register')">Create new account</button>
          </div>
          <div class="row two">
            <div class="field"><label>Email</label><input id="authEmail" type="email" /></div>
            <div class="field"><label>Password</label><input id="authPassword" type="password" /></div>
            ${state.authMode === 'register' ? '<div class="field" style="grid-column:1 / -1;"><small class="muted">Password must be at least 10 characters and include uppercase, lowercase, number, and special character.</small></div>' : ''}
            ${state.authMode === 'register' ? '<div class="field"><label>Your name</label><input id="authName" /></div>' : ''}
            ${state.authMode === 'register' ? '<div class="field"><label>Nonprofit or business name</label><input id="authOrganizationName" /></div>' : ''}
            ${state.authMode === 'register' ? '<div class="field"><label>Street address</label><input id="authStreet" placeholder="123 Main St" /></div>' : ''}
            ${state.authMode === 'register' ? '<div class="field"><label>City</label><input id="authCity" placeholder="Austin" /></div>' : ''}
            ${state.authMode === 'register' ? '<div class="field"><label>State</label><input id="authState" placeholder="TX" /></div>' : ''}
            ${state.authMode === 'register' ? '<div class="field"><label>ZIP code</label><input id="authZip" placeholder="78701" /></div>' : ''}
            ${state.authMode === 'register' ? '<div class="field"><label>Role</label><select id="authRole"><option value="business">Business</option><option value="organization">Nonprofit</option></select></div>' : ''}
          </div>
          <div style="margin-top:10px;display:flex;gap:8px;">
            <button class="btn" onclick="submitAuth()">Continue</button>
          </div>
          ${state.message ? `<div class="message">${escapeHtml(state.message)}</div>` : ''}
        </div>
      `;
    }

    function renderDashboard() {
      const roleClass = state.user.role === 'business' ? 'role-business' : 'role-organization';
      const roleTitle = state.user.role === 'business' ? 'Business Command Center' : 'Nonprofit Exploration Hub';
      const roleIntro = state.user.role === 'business'
        ? 'List available resources, delivery speed, offer close time, and optionally send private offers.'
        : 'Explore live offers, request what you need, and use AI to find the best-fit options near you.';

      if (state.user.role === 'business' && state.dashboardSection === 'match') {
        state.dashboardSection = 'board';
      }
      if (state.user.role === 'organization' && state.dashboardSection === 'post') {
        state.dashboardSection = 'board';
      }
      if (state.user.role === 'organization' && state.dashboardSection === 'match') {
        state.dashboardSection = 'board';
      }

      const boardListings = getBoardListings();
      const selectedListing = getSelectedListing();
      const legacyMatchesHtml = state.legacyMatches.length
        ? state.legacyMatches.map((m) => `<div class="listing"><strong>${escapeHtml(m.businessName)}</strong><div>${escapeHtml(m.description)}</div><div class="small muted">score ${m.score} - ${escapeHtml(m.category)} - ${escapeHtml(m.location || 'local')}</div></div>`).join('')
        : '<div class="small muted">Run a match query to use the classic ranking view.</div>';

      const businessForm = `
        <div class="card">
          <h3>Create business listing</h3>
          <div class="row two">
            <div class="field"><label>Category</label><select id="listingCategory">${categoryOptions()}</select></div>
            <div class="field"><label>Resource name</label><input id="listingResourceName" placeholder="Boxed lunches / projector set / meeting room" /></div>
            <div class="field"><label>Type of resource</label><input id="listingResourceType" placeholder="Vegetarian meals / audio equipment / classroom space" /></div>
            <div class="field"><label>Quantity or capacity</label><input id="listingQuantity" placeholder="30 meals / 2 projectors / room for 20" /></div>
            <div class="field"><label>Delivery ETA (hours)</label><input id="listingDelivery" type="number" min="0" placeholder="4" /></div>
            <div class="field"><label>Offer closes at (expiry)</label><input id="listingClose" type="datetime-local" /></div>
            <div class="field">
              <label>Private offer target (optional)</label>
              <select id="listingPrivateTarget">
                <option value="">Public listing</option>
                ${state.organizations.map((o) => `<option value="${o.id}">${escapeHtml(o.organizationName || o.displayName)} (${escapeHtml(o.location || 'no location')})</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Contact</label><input id="listingContact" /></div>
            <div class="field"><label>Street address</label><input id="listingStreet" placeholder="123 Main St" /></div>
            <div class="field"><label>City</label><input id="listingCity" placeholder="Austin" /></div>
            <div class="field"><label>State</label><input id="listingState" placeholder="TX" /></div>
            <div class="field"><label>ZIP code</label><input id="listingZip" placeholder="78701" /></div>
          </div>
          <div class="field"><label>Availability notes</label><input id="listingAvailabilityNotes" placeholder="Pickup after 2 PM, elevator access, allergen notes, setup details" /></div>
          <div class="field"><label>Description</label><textarea id="listingDescription"></textarea></div>
          <button class="btn" onclick="submitListing()">Post listing</button>
        </div>
        <div class="card">
          <h3>Send private offer directly</h3>
          <div class="row two">
            <div class="field">
              <label>Nonprofit</label>
              <select id="privateTarget">${state.organizations.map((o) => `<option value="${o.id}">${escapeHtml(o.organizationName || o.displayName)}</option>`).join('')}</select>
            </div>
            <div class="field"><label>Category</label><select id="privateCategory">${categoryOptions()}</select></div>
            <div class="field"><label>Resource name</label><input id="privateResourceName" placeholder="Shelf-stable food boxes / folding tables" /></div>
            <div class="field"><label>Type of resource</label><input id="privateResourceType" placeholder="Pantry staples / event furniture / workshop room" /></div>
            <div class="field"><label>Quantity or capacity</label><input id="privateQuantity" placeholder="20 boxes / 8 tables / room for 40" /></div>
            <div class="field"><label>Deliver in hours</label><input id="privateDelivery" type="number" min="0" /></div>
            <div class="field"><label>Offer closes at</label><input id="privateClose" type="datetime-local" /></div>
            <div class="field"><label>Contact</label><input id="privateContact" /></div>
            <div class="field"><label>Street address</label><input id="privateStreet" placeholder="123 Main St" /></div>
            <div class="field"><label>City</label><input id="privateCity" placeholder="Austin" /></div>
            <div class="field"><label>State</label><input id="privateState" placeholder="TX" /></div>
            <div class="field"><label>ZIP code</label><input id="privateZip" placeholder="78701" /></div>
          </div>
          <div class="field"><label>Availability notes</label><input id="privateAvailabilityNotes" placeholder="Dock pickup, loading help available, room access instructions" /></div>
          <div class="field"><label>Description</label><textarea id="privateDescription"></textarea></div>
          <button class="btn" onclick="submitPrivateOffer()">Send private offer</button>
        </div>
      `;

      let sectionContent = '';
      if (state.dashboardSection === 'overview') {
        sectionContent = renderOverviewPanel(roleIntro, selectedListing);
      } else if (state.dashboardSection === 'post') {
        sectionContent = `
          <div class="section-stack">
            ${businessForm}
          </div>
        `;
      } else if (state.dashboardSection === 'match') {
        sectionContent = state.user.role === 'organization' ? `
          <div class="section-stack">
            <div class="card">
              <h3 style="margin-top:0;">AI best + closest match</h3>
              <p class="small muted">This uses current listings plus need context such as urgency, timing, and location. No invented data.</p>
              <div class="row two">
                <div class="field"><label>Your need</label><textarea id="needText" placeholder="Need 60 boxed meals by tomorrow morning"></textarea></div>
                <div class="field"><label>Preferred location</label><input id="needLocation" value="${escapeHtml(state.user.location || '')}" /></div>
              </div>
              <button class="btn" onclick="findBestMatch()">Find best match</button>
              ${renderBestMatchResult()}
            </div>
            <div class="card">
              <h3 style="margin-top:0;">Quick match search</h3>
              <p class="small muted">Search the current listings directly by text.</p>
              <div class="field"><label>Search text</label><input id="classicMatchQuery" placeholder="meeting room afternoon" /></div>
              <div style="margin-top:10px;"><button class="btn" onclick="runClassicMatchSearch()">Find matches</button></div>
              <div style="margin-top:12px;">${legacyMatchesHtml}</div>
            </div>
          </div>
        ` : '<div class="card"><h3 style="margin-top:0;">Match</h3><p class="small muted">Business users can use the AI assistant and live board to prioritize where to help next.</p><div class="inline-actions"><button class="btn" onclick="setDashboardSection(\'ai\')">Open AI assistant</button><button class="btn-alt" onclick="setDashboardSection(\'board\')">Open live board</button></div></div>';
      } else if (state.dashboardSection === 'board') {
        const isNonprofit = state.user.role === 'organization';
        sectionContent = `
          <div class="card">
            <h3>${isNonprofit ? 'Explore available offers' : 'Live board'}</h3>
            <p class="small muted">${isNonprofit ? 'Browse business offers and open any item to request support.' : 'Click an offer or request to open the full record, then switch between all, offers, and requests.'}</p>
            ${isNonprofit ? '' : `<div class="board-toolbar">
              <button class="btn-chip ${state.listingFilter === 'all' ? 'active' : ''}" onclick="setListingFilter('all')">All active</button>
              <button class="btn-chip ${state.listingFilter === 'supply' ? 'active' : ''}" onclick="setListingFilter('supply')">Offers</button>
              <button class="btn-chip ${state.listingFilter === 'demand' ? 'active' : ''}" onclick="setListingFilter('demand')">Requests</button>
            </div>`}
            <div class="board-shell">
              <div>
                ${boardListings.length ? boardListings.map(renderListing).join('') : '<div class="muted">No listings match this view.</div>'}
              </div>
              <div>
                ${renderListingDetail(selectedListing)}
              </div>
            </div>
          </div>
        `;
      } else if (state.dashboardSection === 'activity') {
        sectionContent = `
          <div class="card">
            <h3>Coordination chat</h3>
            <p class="small muted">Yes, this is the live thread with the person or organization you are working with, plus status updates like requested, accepted, on the way, and delivered.</p>
            ${renderEngagements()}
          </div>
        `;
      } else if (state.dashboardSection === 'ai') {
        sectionContent = `
          <div class="card">
            <h3>Live match assistant</h3>
            <p class="small muted">Answers are built from real listing data, user needs, urgency cues, location, and live platform context.</p>
            <div class="field"><textarea id="generalAiPrompt" placeholder="Ask for suggestions based on current listings"></textarea></div>
            <div class="inline-actions">
              <button class="btn" onclick="runQuickRecommend()">Recommend for me</button>
              <button class="btn-alt" onclick="runGeneralAI()">Ask AI</button>
            </div>
            ${state.aiInsights ? `<div class="result"><strong>Summary</strong><div>${escapeHtml(state.aiInsights.summary || '')}</div><div class="small muted" style="margin-top:6px;">${(state.aiInsights.recommendations || []).slice(0, 3).map((r) => escapeHtml(`${r.title}: ${r.action}`)).join(' - ')}</div></div>` : ''}
          </div>
        `;
      }

      root.innerHTML = `
        <div class="card hero">
          <div class="topbar">
            <div>
              <div><span class="pill ${roleClass}">${roleLabel(state.user.role)}</span></div>
              <h2 style="margin:6px 0 0;">${roleTitle}</h2>
              <div class="muted">Welcome, ${escapeHtml(state.user.displayName)}. ${roleIntro}</div>
              <div class="role-shell ${state.user.role === 'business' ? 'business' : 'nonprofit'}">
                <strong>${state.user.role === 'business' ? 'Business path' : 'Nonprofit path'}</strong>
                <div class="small muted">
                  ${state.user.role === 'business'
                    ? 'Create listings, share delivery timing, and route resources publicly or privately.'
                    : 'Explore available offers, request support, and keep all coordination in one place.'}
                </div>
              </div>
              <div class="inline-actions">
                <button class="btn" onclick="setDashboardSection('ai')">Open AI assistant</button>
                <button class="btn-alt" onclick="setDashboardSection('board')">${state.user.role === 'business' ? 'Open live board' : 'Open explore board'}</button>
              </div>
            </div>
            <button class="btn-alt" onclick="logout()">Sign out</button>
          </div>
        </div>

        ${renderScreenNav()}
        ${sectionContent}

        ${state.message ? `<div class="card message">${escapeHtml(state.message)}</div>` : ''}
      `;
    }

    function render() {
      userLine.textContent = state.user
        ? `${state.user.displayName} - ${roleLabel(state.user.role)}${state.user.location ? ` - ${state.user.location}` : ''}`
        : '';

      if (state.view === 'loading') {
        root.innerHTML = '<div class="card">Loading...</div>';
        return;
      }
      if (!state.user || state.view === 'auth') {
        renderAuth();
        return;
      }
      renderDashboard();
    }

    window.submitAuth = submitAuth;
    window.setAuthMode = setAuthMode;
    window.logout = logout;
    window.submitListing = submitListing;
    window.submitPrivateOffer = submitPrivateOffer;
    window.findBestMatch = findBestMatch;
    window.runQuickRecommend = runQuickRecommend;
    window.runGeneralAI = runGeneralAI;
    window.runClassicMatchSearch = runClassicMatchSearch;
    window.requestListing = requestListing;
    window.updateEngagementStatus = updateEngagementStatus;
    window.sendEngagementMessage = sendEngagementMessage;
    window.sendChat = sendChat;
    window.sendPresetChat = sendPresetChat;
    window.handleChatAction = handleChatAction;

    boot();
  </script>
</body>
</html>
